name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install customtkinter requests pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name StudyBuddy --collect-all customtkinter study_buddy.py

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy
          path: dist/StudyBuddy.exe
